<html>
  <head>
    <meta charset="UTF-8" />
    <title>Quizz semaine 44</title>
		<link href="styles.css" rel="stylesheet">
		<script src="securite.js"></script>
		<script>
			const urlParams = new URLSearchParams(window.location.search);

			let parti = [];
			parti[1]='La France Insoumise'; parti[2]='Les Ecologistes'; parti[3]='Parti Socialiste'; parti[4]='Place Publique'; parti[5]='Renaissance'; parti[6]='Horizons'; parti[7]='Les Républicains'; parti[8]='Rassemblement National';
			
			var mesure = Math.floor(Math.random() * programmes.length);
			
			function verifier() {
				if (document.querySelector('input[name="reponse"]:checked')) {
					document.getElementById('total').value=Number(urlParams.get('total'))+1;
					if (programmes[mesure].get('reponse') == document.querySelector('input[name="reponse"]:checked').value) {
						document.getElementById('score').value=Number(urlParams.get('score'))+1;
						alert('Bonne réponse ! Cela fait un score de '+document.getElementById('score').value+' sur '+document.getElementById('total').value);
					} else {
						alert('Non, c\'était '+parti[programmes[mesure].get('reponse')]+' ! Cela fait un score de '+document.getElementById('score').value+' sur '+document.getElementById('total').value);
					}
				} else {
					alert('Il faut sélectionner un parti !');
					const monFormulaire = document.getElementById('formulaire');

					monFormulaire.addEventListener('submit', function(event) {
						if (!document.querySelector('input[name="reponse"]:checked')) {
							event.preventDefault(); // Annule l'envoi du formulaire
						}
					});				
				}
			}
		</script>
  </head>
  <body>
    <div name="quizz" id="quizz">
			<img src="quizz.png" onclick="javascript:document.getElementById('quizz').hidden=true;document.getElementById('theme').hidden=false;" />
		</div>
    <div name="theme" id="theme">
			<div class="conteneur">
					<div class="filigrane-quizz"></div>
					<div class="contenu">
						<p style="position: absolute; top: 100px; left: 250px;">La sécurité et l'ordre public</p>
						<p style="position: absolute; top: 250px; left: 40px; width: 150px;">Une réponse par question</p>
						<p style="position: absolute; top: 250px; left: 410px;"><button onclick="javascript:document.getElementById('theme').hidden=true;document.getElementById('item').hidden=false;">Accéder aux questions</button></p>
					</div>
			</div>
		</div>
    <div name="item" id="item">
			<div class="conteneur">
					<div class="filigrane-item"></div>
					<div class="contenu">
						<p style="position: absolute; top: 50px; left: 30px; width: 300px;">Quel parti propose cette mesure dans son programme&nbsp;?</p>
						<div name="mesure" id="mesure" style="position: absolute; top: 80px; left: 380px; width:200px;"></div>
						<form name="formulaire" id="formulaire">
							<input type="hidden" name="score" id="score" value="0" />
							<input type="hidden" name="total" id="total" value="0" />
							<!--<p style="position: absolute; top: 120px; left: 45px; width: 150px;"><input type="radio" name="reponse" id="reponse" value="1" checked /><label for="1">La France Insoumise</label></p>-->
							<p style="position: absolute; top: 124px; left: 49px; width: 150px;"><input type="radio" name="reponse" id="reponse" value="1" /></p>
							<p style="position: absolute; top: 172px; left: 49px; width: 150px;"><input type="radio" name="reponse" id="reponse" value="7" /></p>
							<p style="position: absolute; top: 220px; left: 49px; width: 150px;"><input type="radio" name="reponse" id="reponse" value="3" /></p>
							<p style="position: absolute; top: 270px; left: 49px; width: 150px;"><input type="radio" name="reponse" id="reponse" value="8" /></p>
							<p style="position: absolute; top: 124px; left: 143px; width: 150px;"><input type="radio" name="reponse" id="reponse" value="4" /></p>
							<p style="position: absolute; top: 172px; left: 143px; width: 150px;"><input type="radio" name="reponse" id="reponse" value="6" /></p>
							<p style="position: absolute; top: 220px; left: 143px; width: 150px;"><input type="radio" name="reponse" id="reponse" value="5" /></p>
							<p style="position: absolute; top: 270px; left: 143px; width: 150px;"><input type="radio" name="reponse" id="reponse" value="2" /></p>
							<p style="position: absolute; top: 320px; left: 49px; width: 150px;"><input type="submit" value="Valider" onclick="javascript:verifier();" />
						</form>
						<p style="position: absolute; top: 320px; left: 150px; width: 150px;"><button onclick="javascript:document.location.replace('index.html');">Recommencer</button></p>
					</div>
			</div>
		</div>
		<script>
			document.getElementById("mesure").textContent = programmes[mesure].get('mesure');
			if (urlParams.has('reponse')) {
				document.getElementById('quizz').hidden=true;
				document.getElementById('theme').hidden=true;
				document.getElementById('item').hidden=false;
				document.getElementById('score').value=urlParams.get('score');
				document.getElementById('total').value=urlParams.get('total');
			} else {
				document.getElementById('quizz').hidden=false;
				document.getElementById('theme').hidden=true;
				document.getElementById('item').hidden=true;
			}
		</script>
  </body>
</html>
